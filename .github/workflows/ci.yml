name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Self-report
        if: matrix.node == 22
        run: node dist/cli.js . --out report.html --no-color
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: self-report
          path: report.html
